--- # ------------------------------------------------------------------
####################################################################
# PopulationSim Properties - Shared SEMCOG Template
####################################################################

# Algorithm/Software Configuration
INTEGERIZE_WITH_BACKSTOPPED_CONTROLS: True
SUB_BALANCE_WITH_FLOAT_SEED_WEIGHTS: False
GROUP_BY_INCIDENCE_SIGNATURE: True
USE_SIMUL_INTEGERIZER: True
USE_CVXPY: False
max_expansion_factor: 30

# Geographic Settings
# ------------------------------------------------------------------
geographies: [REGION, PUMA, TRACT, BLKGRP]
seed_geography: PUMA

# Tracing
# ------------------------------------------------------------------
trace_geography:
  BLKGRP: 261251620002
  TRACT: 26125162000

# Data Directory
# ------------------------------------------------------------------
data_dir: data

# Input Data Tables
# ------------------------------------------------------------------
input_table_list:
  - tablename: households
    filename: SEMCOG_seed_households.csv
    index_col: hh_id
    rename_columns:
      hhnum: hh_id
  - tablename: persons
    filename: SEMCOG_seed_persons.csv
    rename_columns:
      hhnum: hh_id
      SPORDER: per_num
    drop_columns:
  - tablename: geo_cross_walk
    filename: semcog_geo_cross_walk.csv
    rename_columns:
      BLKGRPID: BLKGRP
      TRACTID: TRACT
      PUMAID: PUMA
  - tablename: BLKGRP_control_data
    filename: SEMCOG_control_totals_blkgrp.csv
    rename_columns:
      BLKGRPID: BLKGRP
      TRACTID: TRACT
      PUMAID: PUMA
  - tablename: TRACT_control_data
    filename: SEMCOG_control_totals_tract.csv
    rename_columns:
      BLKGRPID: BLKGRP
      TRACTID: TRACT
      PUMAID: PUMA

# Reserved Column Names
# ------------------------------------------------------------------
household_weight_col: WGTP
household_id_col: hh_id
total_hh_control: num_hh

# Control Specification File Name
# ------------------------------------------------------------------
control_file_name: SEMCOG_controls.csv

# Output Tables
# ------------------------------------------------------------------
output_tables:
  action: include
  tables:
    - summary_BLKGRP
    - summary_TRACT
    - summary_BLKGRP_PUMA
    - expanded_household_ids

# Synthetic Population Output Specification
# ------------------------------------------------------------------
output_synthetic_population:
  household_id: household_id
  households:
    filename: synthetic_households.csv
    columns:
      - NP
      - VEH
      - HINCP
      - R18
      - AGEHOH
      - HRACE
      - HHISP
      - HWORKERS
      - hh_id
      - ADJINC
      - income
      - NOC
      - TYPE
      - YBL
      - BLD
      - VALP
      - GRNTP
      - ADJHSG
      - TEN
      - HHT
  persons:
    filename: synthetic_persons.csv
    columns:
      - hh_id
      - per_num
      - AGEP
      - SEX
      - ESR
      - RAC1P
      - RELP
      - HISP
      - NAICSP
      - industry
      - WKHP
      - WKW
      - SCHG
      - MIL
      - PINCP
      - pincome
      - RELSHIPP

# Steps for base mode
# ------------------------------------------------------------------
models:
    - input_pre_processor
    - setup_data_structures
    - initial_seed_balancing
    - meta_control_factoring
    - final_seed_balancing
    - integerize_final_seed_weights
    - sub_balancing.geography=TRACT
    - sub_balancing.geography=BLKGRP
    - expand_households
    - summarize
    - write_tables
    - write_synthetic_population
